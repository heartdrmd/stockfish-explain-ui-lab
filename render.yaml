# Separate UI Lab account database, matching stockfish-explain-dev-db.
databases:
  - name: stockfish-explain-ui-lab-db
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
    diskSizeGB: 15
    databaseName: stockfish_explain_ui_lab
    user: stockfish_explain_ui_lab
    ipAllowList: []

services:
  - type: web
    name: stockfish-explain-ui-lab
    runtime: node
    plan: free
    region: ohio
    # The lab needs the official Lichess build plus the lite variants already
    # committed to the repository. Skip the optional 1.3 GB custom-engine pack.
    buildCommand: "npm ci && bash scripts/fetch-lichess-stockfish.sh"
    startCommand: "node server.js"
    autoDeploy: true
    envVars:
      # Secret gate-password prefixes (see server.js header). sync:false
      # means "set manually in the Render dashboard, never in this file."
      # The daily password is <prefix> + tomorrow's 2-digit CT day.
      - key: SITE_PW_PREFIX
        sync: false
      - key: PREMIUM_PW_PREFIX
        sync: false
      # Separate master switch for every paid Anthropic request. The UI and
      # /api/ai both remain locked until this rotating password is entered.
      - key: AI_SPEND_PW_PREFIX
        sync: false
      # HMAC secret for signed guest export tokens (audit S3). Optional —
      # if unset the server uses a per-boot random (tokens live 2 min, so
      # a restart only invalidates in-flight downloads). Set for stability.
      - key: EXPORT_TOKEN_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: stockfish-explain-ui-lab-db
          property: connectionString
      # Paid AI remains separately gated; no AI key is added here.
    healthCheckPath: /api/whoami
