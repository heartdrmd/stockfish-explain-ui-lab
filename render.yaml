databases:
  # Postgres for multi-user game archives, mistakes, SRS, favourites.
  # `basic-256mb` plan (~$6/mo, 256 MB RAM, 1 GB storage). Render
  # deprecated the legacy `starter` plan for new databases in late
  # 2024 — `basic-256mb` is the direct replacement. More than enough
  # for a friend-group dev site: ~10 KB/game × 1000 games = 10 MB.
  - name: stockfish-explain-dev-db
    plan: basic-256mb
    region: ohio
    databaseName: stockfish_explain_dev
    user: stockfish_explain_dev

services:
  - type: web
    name: stockfish-explain-dev
    runtime: node
    plan: starter
    region: ohio
    buildCommand: "npm install && bash scripts/fetch-full-wasms.sh && bash scripts/fetch-lichess-stockfish.sh"
    startCommand: "node server.js"
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Secret gate-password prefixes (see server.js header). sync:false
      # means "set manually in the Render dashboard, never in this file."
      # The daily password is <prefix> + tomorrow's 2-digit CT day.
      - key: SITE_PW_PREFIX
        sync: false
      - key: PREMIUM_PW_PREFIX
        sync: false
      # Separate master switch for every paid Anthropic request. The UI and
      # /api/ai both remain locked until this rotating password is entered.
      - key: AI_SPEND_PW_PREFIX
        sync: false
      # HMAC secret for signed guest export tokens (audit S3). Optional —
      # if unset the server uses a per-boot random (tokens live 2 min, so
      # a restart only invalidates in-flight downloads). Set for stability.
      - key: EXPORT_TOKEN_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # DATABASE_URL is auto-populated by Render when the web service
      # is linked to the database above via the fromDatabase binding.
      # When creating the DB manually, paste the Internal Database URL
      # into the Environment tab instead.
      - key: DATABASE_URL
        fromDatabase:
          name: stockfish-explain-dev-db
          property: connectionString
    healthCheckPath: /api/whoami
