services:
  - type: web
    name: stockfish-explain-ui-lab
    runtime: node
    plan: free
    region: ohio
    buildCommand: "npm install && bash scripts/fetch-full-wasms.sh && bash scripts/fetch-lichess-stockfish.sh"
    startCommand: "node server.js"
    autoDeploy: true
    envVars:
      # Secret gate-password prefixes (see server.js header). sync:false
      # means "set manually in the Render dashboard, never in this file."
      # The daily password is <prefix> + tomorrow's 2-digit CT day.
      - key: SITE_PW_PREFIX
        sync: false
      - key: PREMIUM_PW_PREFIX
        sync: false
      # Separate master switch for every paid Anthropic request. The UI and
      # /api/ai both remain locked until this rotating password is entered.
      - key: AI_SPEND_PW_PREFIX
        sync: false
      # HMAC secret for signed guest export tokens (audit S3). Optional —
      # if unset the server uses a per-boot random (tokens live 2 min, so
      # a restart only invalidates in-flight downloads). Set for stability.
      - key: EXPORT_TOKEN_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Deliberately no DATABASE_URL and no paid-AI key in the first UI lab.
      # The browser uses isolated localStorage while the interface is tested.
    healthCheckPath: /api/whoami
